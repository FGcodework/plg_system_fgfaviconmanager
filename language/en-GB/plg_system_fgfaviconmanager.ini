PLG_SYSTEM_FGFAVICONMANAGER="System - FG Favicon Manager"
PLG_SYSTEM_FGFAVICONMANAGER_XML_DESCRIPTION="Replace the default frontend and administrator favicons with your own icons. Supports ICO, PNG and SVG, dark-mode variants, Apple touch icons, Android/PWA manifest and theme-color, injected automatically without editing any template."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_FRONTEND="Frontend Favicon"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_ADVANCED="Advanced"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_ADMIN="Administrator Favicon"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_PWA="Android / PWA Manifest"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_INFO="Info"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_SOURCE_LABEL="Favicon Source"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_SOURCE_DESC="Select the main favicon image (ICO, PNG, WebP, AVIF or SVG - anything GD or Imagick on this server can decode). For full multi-device support (16-512px, Apple touch icon, PWA icons), upload a square PNG of at least 512x512px. If you upload an SVG, it is used directly as the modern vector icon. If WebP or AVIF does not appear in the Media Manager picker, add it under Content -> Media -> Options -> Legal Image Extensions first."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_DARK_LABEL="Dark Mode Favicon (optional)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_DARK_DESC="Optional alternate favicon shown automatically when the visitor's system is in dark mode (via prefers-color-scheme). Leave empty to always use the main favicon."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_LABEL="Apple Touch Icon (optional override)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_DESC="Optional dedicated image for the iOS home screen icon (recommended 180x180px). If left empty, it is generated automatically from the main favicon source."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_LABEL="Theme Color"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DESC="Browser/UI theme colour used when the site is installed as a web app or opened in supporting browsers."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DARK_LABEL="Theme Color (dark mode, optional)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DARK_DESC="Optional alternate theme colour applied when the visitor's system is in dark mode."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_DEBUG_LABEL="Debug Mode"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_DEBUG_DESC="Inserts an HTML comment before </head> explaining exactly why no favicon was injected (missing source, GD extension, file permissions, etc). View Source on the page to read it. The comment is visible to every visitor of the page (server paths are shortened to [webroot]), so keep this OFF on a live site and enable it only while diagnosing a problem."


PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_FAVICON_LABEL="Administrator Favicon (optional)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_FAVICON_DESC="Optional separate favicon shown only in the Joomla administrator panel, useful to quickly tell apart multiple sites/backends. If left empty, the frontend favicon is reused."


PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_NAME_LABEL="App Name"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_NAME_DESC="Full name shown for the installed app. Leave empty to use the site name."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_SHORT_NAME_LABEL="App Short Name"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_SHORT_NAME_DESC="Short name shown under the home screen icon. Leave empty to use the site name."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_BG_LABEL="Manifest Background Color"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_BG_DESC="Background colour shown on the splash screen while the installed app is loading."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_QUICKSTART_LABEL="Quick Start"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_QUICKSTART_DESC="This plugin replaces your site's favicon - and, if you want, the administrator panel's too - with your own icons, generated automatically from a single source image. No template editing needed. To get started: 1) Go to the Frontend Favicon tab and choose a square image, ideally at least 512x512px (PNG or SVG work best). 2) Optionally pick a Theme Color. 3) Save. That's it - every icon size, favicon.ico, the PWA manifest and the Apple touch icon are generated automatically the next time the site is viewed. Everything else in this screen (Advanced, Administrator, PWA, Apple, Maintenance) is optional and already has sensible defaults - only visit those tabs if you want something specific, like a dark-mode variant, a separate admin icon, or “add to home screen” support on iOS. If the favicon does not appear after saving, turn on Debug Mode under the Advanced tab - it explains exactly why directly in the page's source code."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_SIZES_NOTE_LABEL="Technical Reference"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_SIZES_NOTE_DESC="From your favicon source, the plugin automatically generates: 16x16, 32x32, 48x48, 192x192 and 512x512 PNGs, a multi-resolution favicon.ico (16/32/48), and a 180x180 Apple touch icon. Recommended source size: at least 512x512px, square, PNG with transparency. Imaging engine: GD is used when available, with Imagick as an automatic fallback (only one of the two is required). SVG sources are used directly as the vector icon; generating the PNG fallback set from an SVG additionally needs Imagick with the rsvg-convert binary (Debian/Ubuntu package: librsvg2-bin) and the PHP DOM extension, which is used to safety-check the SVG first (without it the SVG is not rasterised and only the vector icon is published). Without it, only the vector icon is used and the PWA manifest / Apple touch icon are skipped unless separately provided. WebP and AVIF sources work the same way as PNG/JPEG (decoded via GD or Imagick, whichever supports them). AVIF support in particular varies a lot between servers - some GD or Imagick builds cannot decode it at all, and the plugin then quietly falls back to the other engine or, if neither can, reports why in Debug Mode without breaking the page. When unsure, PNG remains the safest choice."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_STRIP_MODE_LABEL="Template Conflict Strip"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_STRIP_MODE_DESC="Controls how firmly competing favicon tags output by your template (e.g. Helix Ultimate) are removed from the rendered page, so your custom favicon wins."
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_OFF="Off - leave all existing tags alone"
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_SOFT="Soft - remove favicon and apple-touch-icon tags only (recommended)"
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_AGGRESSIVE="Aggressive - also remove mask-icon and any foreign web manifest"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_MODE_LABEL="Web Manifest Mode"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_MODE_DESC="Off: never link a manifest. Generate: always write and link our own. Defer: skip ours when another extension (e.g. a dedicated PWA plugin) already provides a manifest on the page - favicons, Apple icons and theme-color are still handled either way."
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_OFF="Off - no manifest link"
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_GENERATE="Generate - always use ours"
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_DEFER="Defer - yield to an existing manifest"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_LABEL="Maskable Android Icons"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_DESC="Android adaptive icons crop your icon into a circle, squircle or rounded square. When enabled, extra 192 and 512 icons are generated with safe-zone padding and a solid background, and added to the manifest with purpose 'maskable', so your logo is never clipped."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_PADDING_LABEL="Safe Zone Padding (%)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_PADDING_DESC="How much to shrink your mark on each side to survive Android's crop. 12% suits most logos; increase towards 20% for marks that reach the edges, decrease for very compact ones. Range 0-40."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_BG_LABEL="Maskable Background Color"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_BG_DESC="Fills the area around your mark on maskable icons. Maskable icons should not be transparent - pick your brand or logo background colour."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_THEME_COLOR_LABEL="Administrator Theme Color (optional)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_THEME_COLOR_DESC="Optional separate theme-color used only in the administrator, so the backend browser chrome can be tinted differently from the public site."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_DARK_LABEL="Use Frontend Dark Mode Favicon in Admin"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_DARK_DESC="Also apply the dark-mode favicon variant configured under Frontend Favicon (via prefers-color-scheme) in the administrator panel. Off by default: the dark variant is designed to pair with the frontend icon, which may not always suit a distinct Administrator Favicon if you set one above."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_APPLE="iOS / Apple Web App"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_CAPABLE_LABEL="Enable iOS Web App Mode"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_CAPABLE_DESC="Adds apple-mobile-web-app-capable and mobile-web-app-capable. When the site is added to the iOS Home Screen, it then opens full-screen without Safari's browser chrome, like an installed app. This changes visible behaviour for anyone who saves the site, so it is off by default."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_STATUSBAR_LABEL="Status Bar Style"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_STATUSBAR_DESC="Appearance of the iOS status bar when the site is running as a Home Screen web app."
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_DEFAULT="Default (light background, dark text)"
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_BLACK="Black (opaque)"
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_TRANSLUCENT="Black translucent (overlays your content)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_TITLE_LABEL="Home Screen Title (optional)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_TITLE_DESC="Short label shown under the icon on the iOS Home Screen. Leave empty to use iOS's default (the page title). Not one of the required tags, but commonly set alongside them."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_LABEL="Generate Splash Screens"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_DESC="Generates apple-touch-startup-image assets (icon centred on a solid background) for common iPhone and iPad screen sizes, shown briefly while the Home Screen web app launches. Covers current mainstream devices, not every model ever made or landscape orientation; a device outside this list simply gets no splash image, same as before this option existed."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_BG_LABEL="Splash Screen Background Color"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_BG_DESC="Fills the area around your icon on the generated splash screens. Splash screens should not be transparent - pick your brand or logo background colour."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_MAINTENANCE="Cache Maintenance"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_CLEARCACHE_LABEL="Icon Cache"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_CLEARCACHE_DESC="Cache is normally invalidated automatically when a source image changes (based on its modified time and size). That check can miss a change if a file is restored with both its original timestamp and file size preserved - for example by `rsync -a` or some backup-restore tools. If you replaced a source image this way and still see the old favicon, use this button to wipe the cache and force a fresh generation on the next page view."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_BUTTON="Clear Icon Cache"
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_CONFIRM="Delete all generated favicons, maskable icons, splash screens and manifests? They will be regenerated automatically the next time a page is viewed."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_BUSY="Clearing cache…"
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_DONE="Done - removed %d cached item(s)."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_ERROR="Something went wrong - check the browser console or your server's error log."
PLG_SYSTEM_FGFAVICONMANAGER_SUPPORT_NOTE_DESC="<p><strong>Do you find FG Favicon Manager useful?</strong><br>It is free and open source. If it saves you time, you can support its development with a voluntary donation on <a href='https://ko-fi.com/FGcodework' target='_blank' rel='noopener'>Ko-fi</a>. More Joomla extensions: <a href='https://fgcodework.github.io' target='_blank' rel='noopener'>fgcodework.github.io</a>.</p>"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_PREVIEW_LABEL="Preview and Export"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_PREVIEW_DESC="Shows every icon that will be generated from the images currently selected above - even before you save - exactly as the site will serve them. 'Download ZIP' exports the same files plus a ready-made HTML snippet, for use on a site without this plugin."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_BUTTON="Preview icons"
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_ZIP="Download ZIP"
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_BUSY="Generating icons…"
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_ERROR="Something went wrong - check the browser console or your server's error log."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_NOSOURCE="Select a Favicon Source image first."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_MAIN="Favicon"
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_DARK="Dark mode favicon"
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_NOTSQUARE="The source is not square (%1$d x %2$d). It is padded to fit a square - crop it to 1:1 to use the full icon area."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_SMALL="The source is only %1$d x %2$d. Larger sizes are upscaled and may look blurry - use at least 512 x 512 px."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_EMPTY="No files were generated."
PLG_SYSTEM_FGFAVICONMANAGER_PREVIEW_DISABLED="The plugin did not answer. Make sure “System - FG Favicon Manager” is enabled (Status: Enabled), then save and try again."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_DISPLAY_LABEL="App Display Mode"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_DISPLAY_DESC="How the installed web app is shown on the device. Standalone looks like a native app (no browser bar) and is the usual choice."
PLG_SYSTEM_FGFAVICONMANAGER_DISPLAY_STANDALONE="Standalone (like a native app)"
PLG_SYSTEM_FGFAVICONMANAGER_DISPLAY_MINIMAL="Minimal UI (with a small browser toolbar)"
PLG_SYSTEM_FGFAVICONMANAGER_DISPLAY_FULLSCREEN="Fullscreen (no system bars)"
PLG_SYSTEM_FGFAVICONMANAGER_DISPLAY_BROWSER="Browser (normal tab)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_ORIENTATION_LABEL="App Orientation"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_ORIENTATION_DESC="Locks the installed app to one orientation. Leave on 'Any' unless the site only works in one."
PLG_SYSTEM_FGFAVICONMANAGER_ORIENTATION_ANY="Any (device decides)"
PLG_SYSTEM_FGFAVICONMANAGER_ORIENTATION_PORTRAIT="Portrait"
PLG_SYSTEM_FGFAVICONMANAGER_ORIENTATION_LANDSCAPE="Landscape"
