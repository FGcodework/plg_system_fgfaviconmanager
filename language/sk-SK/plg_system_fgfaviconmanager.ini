PLG_SYSTEM_FGFAVICONMANAGER="System - FG Favicon Manager"
PLG_SYSTEM_FGFAVICONMANAGER_XML_DESCRIPTION="Nahradí predvolené favicony na frontende aj v administrácii vlastnými ikonami. Podporuje ICO, PNG a SVG, variant pre tmavý režim, Apple touch icon, Android/PWA manifest a theme-color — vloží sa automaticky bez úpravy šablóny."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_FRONTEND="Favicon pre frontend"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_ADVANCED="Pokročilé"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_ADMIN="Favicon pre administráciu"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_PWA="Android / PWA manifest"
PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_INFO="Informácie"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_SOURCE_LABEL="Zdrojový obrázok favicony"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_SOURCE_DESC="Vyber hlavný obrázok favicony (ICO, PNG, WebP, AVIF alebo SVG — čokoľvek, čo na tomto serveri vie dekódovať GD alebo Imagick). Pre plnú podporu na všetkých zariadeniach (16 – 512 px, Apple touch icon, PWA ikony) nahraj štvorcové PNG s rozmerom aspoň 512×512 px. Ak nahráš SVG, použije sa priamo ako moderná vektorová ikona. Ak sa WebP alebo AVIF nezobrazí vo výbere Media Manager, najprv ho pridaj v Content -> Media -> Options -> Legal Image Extensions."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_DARK_LABEL="Favicon pre tmavý režim (voliteľné)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_FAVICON_DARK_DESC="Voliteľná alternatívna favicon, ktorá sa automaticky zobrazí, keď má návštevník systém v tmavom režime (cez prefers-color-scheme). Ak necháš prázdne, vždy sa použije hlavná favicon."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_LABEL="Apple Touch Icon (voliteľné prepísanie)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_DESC="Voliteľný samostatný obrázok pre ikonu na ploche iOS (odporúčané 180×180 px). Ak necháš prázdne, vygeneruje sa automaticky z hlavného zdroja favicony."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_LABEL="Farba témy (theme-color)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DESC="Farba rozhrania prehliadača použitá, keď je stránka nainštalovaná ako webová aplikácia alebo otvorená v podporovanom prehliadači."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DARK_LABEL="Farba témy pre tmavý režim (voliteľné)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_THEME_COLOR_DARK_DESC="Voliteľná alternatívna farba témy, ktorá sa použije, keď má návštevník systém v tmavom režime."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_DEBUG_LABEL="Debug režim"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_DEBUG_DESC="Vloží pred </head> HTML komentár s presným vysvetlením, prečo sa favicon nevložil (chýbajúci zdroj, GD rozšírenie, práva na súbory a pod.). Zobraz si zdrojový kód stránky (View Source), aby si si ho prečítal. Po vyriešení problému vypni."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_FAVICON_LABEL="Favicon pre administráciu (voliteľné)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_FAVICON_DESC="Voliteľná samostatná favicon zobrazená len v administrácii Joomly — užitočné na rýchle rozlíšenie viacerých webov/backendov. Ak necháš prázdne, použije sa favicon z frontendu."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_NAME_LABEL="Názov aplikácie"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_NAME_DESC="Celý názov zobrazený pre nainštalovanú aplikáciu. Ak necháš prázdne, použije sa názov webu."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_SHORT_NAME_LABEL="Krátky názov aplikácie"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_SHORT_NAME_DESC="Krátky názov zobrazený pod ikonou na ploche. Ak necháš prázdne, použije sa názov webu."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_BG_LABEL="Farba pozadia manifestu"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_BG_DESC="Farba pozadia zobrazená na úvodnej obrazovke (splash screen) počas načítavania nainštalovanej aplikácie."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_QUICKSTART_LABEL="Rýchly štart"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_QUICKSTART_DESC="Tento plugin nahradí faviconu webu — a ak chceš, aj administrácie — vlastnými ikonami, ktoré sa automaticky vygenerujú z jedného zdrojového obrázka. Netreba upravovať šablónu. Ako začať: 1) Choď do tabu Favicon pre frontend a vyber štvorcový obrázok, ideálne aspoň 512×512 px (najlepšie funguje PNG alebo SVG). 2) Voliteľne nastav farbu témy (Theme Color). 3) Ulož. To je všetko — všetky veľkosti ikon, favicon.ico, PWA manifest aj Apple touch icon sa vygenerujú automaticky pri najbližšom zobrazení webu. Všetko ostatné na tejto obrazovke (Pokročilé, Administrácia, PWA, Apple, Údržba) je voliteľné a má už nastavené rozumné predvolené hodnoty — do týchto tabov choď len vtedy, ak potrebuješ niečo konkrétne, napríklad tmavý variant, samostatnú ikonu pre administráciu, alebo podporu „pridať na plochuâ na iOS. Ak sa favicon po uložení nezobrazí, zapni Debug Mode v tabe Pokročilé — presne vysvetlí prečo, priamo v zdrojovom kóde stránky."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_SIZES_NOTE_LABEL="Technická referencia"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_SIZES_NOTE_DESC="Zo zdroja favicony sa automaticky generujú: PNG vo veľkostiach 16×16, 32×32, 48×48, 192×192 a 512×512, multi-rozlíšenie favicon.ico (16/32/48) a 180×180 Apple touch icon. Odporúčaná veľkosť zdroja: aspoň 512×512 px, štvorcový, PNG s priehľadnosťou. Zobrazovací engine: použije sa GD, ak je dostupné, s automatickým prechodom na Imagick (stačí jedna z dvoch knižníc). SVG zdroje sa použijú priamo ako vektorová ikona; vygenerovanie PNG fallback sady zo SVG navyše vyžaduje Imagick s binárkou rsvg-convert (na Debiane/Ubuntu balík librsvg2-bin). Bez nej sa použije len vektorová ikona a PWA manifest / Apple touch icon sa preskočia, pokiaľ nie sú zadané samostatne. WebP a AVIF zdroje fungujú rovnako ako PNG/JPEG (dekódujú sa cez GD alebo Imagick, podľa toho, ktoré ich podporuje). Podpora AVIF sa medzi servermi výrazne líši — niektoré zostavenia GD alebo Imagick ho vôbec nevedia dekódovať; plugin v takom prípade ticho prejde na druhú knižnicu, prípadne, ak nevie ani jedna, dôvod uvedie v Debug Mode bez toho, aby rozbil stránku. Ak si nie si istý, najbezpečnejšia voľba zostáva PNG."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_STRIP_MODE_LABEL="Odstránenie konfliktných favicon tagov šablóny"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_STRIP_MODE_DESC="Určuje, ako dôsledne sa z vykreslenej stránky odstránia konkurenčné favicon tagy vkladané šablónou (napr. Helix Ultimate), aby vždy vyhrala tvoja vlastná favicon."
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_OFF="Vypnuté — ponechať všetky existujúce tagy"
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_SOFT="Mierne — odstrániť len favicon a apple-touch-icon tagy (odporúčané)"
PLG_SYSTEM_FGFAVICONMANAGER_STRIP_AGGRESSIVE="Dôsledne — odstrániť aj mask-icon a akýkoľvek cudzí web manifest"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_MODE_LABEL="Režim Web Manifestu"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MANIFEST_MODE_DESC="Vypnuté: nikdy neodkazovať na manifest. Generovať: vždy zapísať a odkázať na náš vlastný. Odložiť: preskočiť náš manifest, ak už na stránke existuje manifest z iného rozšírenia (napr. samostatný PWA plugin) — favicon, Apple ikony a farba témy sa spracujú v každom prípade."
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_OFF="Vypnuté — bez odkazu na manifest"
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_GENERATE="Generovať — vždy použiť náš"
PLG_SYSTEM_FGFAVICONMANAGER_MANIFEST_DEFER="Odložiť — ustúpiť existujúcemu manifestu"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_LABEL="Maskable Android ikony"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_DESC="Android adaptívne ikony orežú ikonu do kruhu, squircle tvaru alebo zaobleného štvorca. Pri zapnutí sa vygenerujú extra ikony 192 a 512 s bezpečnostným paddingom a plnou farbou pozadia a pridajú sa do manifestu s hodnotou purpose “maskable”, takže logo nikdy nebude orezané."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_PADDING_LABEL="Bezpečnostný padding (%)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_PADDING_DESC="O koľko zmenšiť logo z každej strany, aby prežilo orezanie na Androide. 12 % vyhovuje väčšine log; pre logá siahajúce až po okraj zvýš smerom k 20 %, pre veľmi kompaktné znížuj. Rozsah 0 – 40."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_BG_LABEL="Farba pozadia maskable ikon"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_MASKABLE_BG_DESC="Vyplní plochu okolo loga na maskable ikonách. Maskable ikony by nemali byť priehľadné — zvoľ farbu značky alebo pozadia loga."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_THEME_COLOR_LABEL="Farba témy administrácie (voliteľné)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_THEME_COLOR_DESC="Voliteľná samostatná farba témy použitá len v administrácii, aby sa rozhranie backendu prehliadača dalo odlíšiť od verejnej stránky webu."

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_DARK_LABEL="Použiť frontend dark mode favicon aj v administrácii"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_ADMIN_DARK_DESC="Použije aj v administrácii dark-mode variant favicony nastavený vo Favicon pre frontend (cez prefers-color-scheme). Predvolene vypnuté — dark variant je navrhnutý ako doplnok k frontend ikone, čo sa nemusí vždy hodiť k samostatnej Favicon pre administráciu, ak je nastavená vyššie."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_APPLE="iOS / Apple Web App"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_CAPABLE_LABEL="Povoliť režim webovej aplikácie na iOS"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_CAPABLE_DESC="Pridá apple-mobile-web-app-capable a mobile-web-app-capable. Keď návštevník pridá web na plochu iOS, otvorí sa potom na celú obrazovku bez rozhrania Safari, ako nainštalovaná aplikácia. Mení to viditeľné správanie pre každého, kto si stránku uloží, preto je predvolene vypnuté."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_STATUSBAR_LABEL="Štýl stavového riadku"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_STATUSBAR_DESC="Vzhľad stavového riadku iOS, keď web beží ako webová aplikácia z plochy."
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_DEFAULT="Predvolený (svetlé pozadie, tmavý text)"
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_BLACK="Čierny (nepriehľadný)"
PLG_SYSTEM_FGFAVICONMANAGER_STATUSBAR_TRANSLUCENT="Čierny priehľadný (prekrýva obsah stránky)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_TITLE_LABEL="Názov na ploche (voliteľné)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_TITLE_DESC="Krátky popisok zobrazený pod ikonou na ploche iOS. Ak necháš prázdne, použije sa predvolená hodnota iOS (názov stránky). Nie je to jeden z požadovaných tagov, ale bežne sa nastavuje spolu s nimi."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_LABEL="Generovať úvodné obrazovky (splash screens)"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_DESC="Vygeneruje apple-touch-startup-image obrázky (ikona vycentrovaná na plnej farbe pozadia) pre bežné veľkosti obrazoviek iPhone a iPad, zobrazené krátko počas spúšťania webovej aplikácie z plochy. Pokrýva aktuálne bežné zariadenia, nie každý model ani orientáciu na šírku; zariadenie mimo tohto zoznamu jednoducho nedostane úvodnú obrazovku, rovnako ako pred zavedením tejto voľby."
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_BG_LABEL="Farba pozadia úvodných obrazoviek"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_APPLE_SPLASH_BG_DESC="Vyplní plochu okolo ikony na vygenerovaných úvodných obrazovkách. Úvodné obrazovky by nemali byť priehľadné — zvoľ farbu značky alebo pozadia loga."

PLG_SYSTEM_FGFAVICONMANAGER_FIELDSET_MAINTENANCE="Údržba cache"

PLG_SYSTEM_FGFAVICONMANAGER_FIELD_CLEARCACHE_LABEL="Cache ikon"
PLG_SYSTEM_FGFAVICONMANAGER_FIELD_CLEARCACHE_DESC="Cache sa bežne invaliduje automaticky, keď sa zmení zdrojový obrázok (podľa času poslednej zmeny a veľkosti súboru). Táto kontrola môže zmenu prehliadnuť, ak sa súbor obnoví so zachovaným pôvodným časom aj veľkosťou — napríklad cez `rsync -a` alebo niektoré nástroje na obnovu zo zálohy. Ak si takto nahradil zdrojový obrázok a stále vidíš starú faviconu, použi toto tlačidlo na vymazanie cache a vynútenie nového generovania pri ďalšom zobrazení stránky."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_BUTTON="Vymazať cache ikon"
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_CONFIRM="Vymazať všetky vygenerované favicony, maskable ikony, splash screens a manifesty? Znovu sa vygenerujú automaticky pri najbližšom zobrazení stránky."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_BUSY="Vymazáva sa cache…"
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_DONE="Hotovo — odstránených %d položiek z cache."
PLG_SYSTEM_FGFAVICONMANAGER_CLEARCACHE_ERROR="Niečo sa pokazilo — pozri konzolu prehliadača alebo chybový log servera."
PLG_SYSTEM_FGFAVICONMANAGER_SUPPORT_NOTE_DESC="<p><strong>Je pre vás FG Favicon Manager užitočný?</strong><br>Je zadarmo a open source. Ak vám šetrí čas, môžete podporiť jeho vývoj dobrovoľným príspevkom na <a href='https://ko-fi.com/FGcodework' target='_blank' rel='noopener'>Ko-fi</a>. Ďalšie Joomla rozšírenia: <a href='https://fgcodework.github.io' target='_blank' rel='noopener'>fgcodework.github.io</a>.</p>"
