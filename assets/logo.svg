<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#27427a"/><stop offset="0.55" stop-color="#16294f"/><stop offset="1" stop-color="#0a1223"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#4a6bb0" stop-opacity="0.45"/><stop offset="1" stop-color="#4a6bb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde5f6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6def2"/><stop offset="1" stop-color="#c3cfe9"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff8a66"/><stop offset="0.55" stop-color="#ff6b4a"/><stop offset="1" stop-color="#e84d2c"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2b4379"/><stop offset="1" stop-color="#14244a"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8edf8"/>
    </linearGradient>
    <filter id="shWin" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#02060f" flood-opacity="0.5"/>
    </filter>
    <filter id="shChip" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#1b2d52" flood-opacity="0.30"/>
    </filter>
    <filter id="shStar" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="tileClip"><rect width="512" height="512" rx="95"/></clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>
  <!-- window -->
  <rect x="64" y="112" width="384" height="288" rx="34" fill="url(#win)" filter="url(#shWin)"/>
  <rect x="65.5" y="113.5" width="381" height="285" rx="32.5" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <!-- title bar -->
  <path d="M64 146 a34 34 0 0 1 34-34 H414 a34 34 0 0 1 34 34 V170 H64 Z" fill="url(#bar)"/>
  <rect x="64" y="169" width="384" height="2.5" fill="#b4c2e0" opacity="0.7"/>
  <circle cx="98"  cy="141" r="8.5" fill="url(#coral)" filter="url(#shStar)"/>
  <circle cx="124" cy="141" r="8.5" fill="#a9b6d4" filter="url(#shStar)"/>
  <circle cx="150" cy="141" r="8.5" fill="#a9b6d4" filter="url(#shStar)"/>
  <!-- address bar (inset) -->
  <rect x="92" y="195" width="328" height="54" rx="27" fill="#eef2fb" stroke="#bfcbe6" stroke-width="3"/>
  <rect x="93.5" y="196.5" width="325" height="51" rx="25.5" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <rect x="164" y="217" width="150" height="11" rx="5.5" fill="#9aa8c8"/>
  <rect x="100" y="203" width="38" height="38" rx="11" fill="url(#coral)" filter="url(#shChip)"/>
  <path d="M119 209.5 l3.3 6.7 7.4 1.1-5.4 5.2 1.3 7.4-6.6-3.5-6.6 3.5 1.3-7.4-5.4-5.2 7.4-1.1z" fill="url(#star)" filter="url(#shStar)"/>
  <!-- size chips -->
  <rect x="96"  y="284" width="84" height="84" rx="24" fill="url(#coral)" filter="url(#shChip)"/>
  <rect x="200" y="302" width="64" height="64" rx="19" fill="url(#navy)" filter="url(#shChip)"/>
  <rect x="284" y="318" width="48" height="48" rx="14" fill="url(#navy)" filter="url(#shChip)"/>
  <rect x="352" y="330" width="36" height="36" rx="11" fill="url(#navy)" filter="url(#shChip)"/>
  <!-- chip top highlights -->
  <g fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2">
    <path d="M104 296 a16 16 0 0 1 16-10 h40"/>
  </g>
  <path d="M138 302 l8.3 16.9 18.7 2.7-13.5 13.2 3.2 18.6-16.7-8.8-16.7 8.8 3.2-18.6-13.5-13.2 18.7-2.7z" fill="url(#star)" filter="url(#shStar)"/>
  <path d="M232 316 l6 12.2 13.4 2-9.7 9.5 2.3 13.4-12-6.3-12 6.3 2.3-13.4-9.7-9.5 13.4-2z" fill="url(#coral)"/>
  <path d="M308 330 l4.5 9.2 10.1 1.5-7.3 7.1 1.7 10.1-9-4.7-9 4.7 1.7-10.1-7.3-7.1 10.1-1.5z" fill="url(#coral)"/>
  <path d="M370 339 l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z" fill="url(#coral)"/>
</svg>
