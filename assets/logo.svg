<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2d52"/>
      <stop offset="1" stop-color="#0a1223"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a66"/>
      <stop offset="1" stop-color="#f2502f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2f4a85" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f4a85" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="shs" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="95" fill="url(#bg)"/>
  <rect width="512" height="512" rx="95" fill="url(#glow)"/>

  <!-- browser window -->
  <rect x="64" y="112" width="384" height="288" rx="36" fill="url(#card)" filter="url(#sh)"/>
  <!-- title bar -->
  <path d="M64 148 a36 36 0 0 1 36-36 H412 a36 36 0 0 1 36 36 V172 H64 Z" fill="#c9d5ec"/>
  <circle cx="98"  cy="142" r="8" fill="#f2502f"/>
  <circle cx="124" cy="142" r="8" fill="#1b2d52" opacity="0.35"/>
  <circle cx="150" cy="142" r="8" fill="#1b2d52" opacity="0.35"/>
  <!-- address bar with the favicon -->
  <rect x="92" y="196" width="328" height="52" rx="26" fill="#ffffff" stroke="#c9d5ec" stroke-width="3"/>
  <g filter="url(#shs)">
    <rect x="100" y="203" width="38" height="38" rx="11" fill="url(#coral)"/>
  </g>
  <path d="M119 210 l3.3 6.7 7.4 1.1-5.4 5.2 1.3 7.4-6.6-3.5-6.6 3.5 1.3-7.4-5.4-5.2 7.4-1.1z" fill="#fff"/>
  <rect x="156" y="216" width="150" height="12" rx="6" fill="#1b2d52" opacity="0.25"/>
  <!-- generated sizes: descending favicon chips -->
  <g filter="url(#shs)">
    <rect x="96"  y="286" width="84" height="84" rx="24" fill="url(#coral)"/>
    <rect x="200" y="304" width="64" height="64" rx="19" fill="#1b2d52"/>
    <rect x="284" y="320" width="48" height="48" rx="14" fill="#1b2d52"/>
    <rect x="352" y="332" width="36" height="36" rx="11" fill="#1b2d52"/>
  </g>
  <path d="M138 304 l8.3 16.9 18.7 2.7-13.5 13.2 3.2 18.6-16.7-8.8-16.7 8.8 3.2-18.6-13.5-13.2 18.7-2.7z" fill="#fff"/>
  <path d="M232 318 l6 12.2 13.4 2-9.7 9.5 2.3 13.4-12-6.3-12 6.3 2.3-13.4-9.7-9.5 13.4-2z" fill="#ff7452"/>
  <path d="M308 332 l4.5 9.2 10.1 1.5-7.3 7.1 1.7 10.1-9-4.7-9 4.7 1.7-10.1-7.3-7.1 10.1-1.5z" fill="#ff7452"/>
  <path d="M370 341 l3.4 6.9 7.6 1.1-5.5 5.4 1.3 7.6-6.8-3.6-6.8 3.6 1.3-7.6-5.5-5.4 7.6-1.1z" fill="#ff7452"/>
</svg>
